<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">

  <div class="landing-container">

    <h1>FinTrack</h1>

    <h2>Your Personal Finance Tracker</h2>

    <p>
      Manage your daily expenses, track your budget
      and visualize your spending with a modern dashboard.
    </p>

    <form id="loginForm">

      <input
        type="text"
        id="username"
        placeholder="Enter Your Name"
        required
      >

      <button type="submit">
        Go To Dashboard
      </button>

    </form>

    <div class="tagline">
      Smart ||  Simple
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
